<!-- 10 · PIN del equipo recordado (vistas/pin.js): abre Registros y Usuarios en la tablet.
     Dos modos: "abrir" (pedir el PIN) y "crear" (PIN nuevo; con contrasena si la sesion no entro con ella) -->
<div class="modal fade" id="modalPin" tabindex="-1" aria-labelledby="tPin" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 modal-tope tope-altura">
      <form class="modal-body p-4 d-flex flex-column gap-3" id="formPin" novalidate>
        <h2 class="tipo-titulo mb-0 titulo-modal" id="tPin">Registros bloqueado</h2>
        <p class="mb-0 text-body-secondary" id="pinTexto"></p>

        <div id="pinClaveGrupo" hidden>
          <label for="pinClave" class="form-label tipo-titulo text-uppercase fw-semibold rotulo-campo-compacto">Tu contraseña</label>
          <input type="password" class="form-control form-control-lg" id="pinClave" autocomplete="current-password">
          <div class="invalid-feedback" id="pinClaveAviso"></div>
        </div>

        <div>
          <label for="pinNuevo" class="form-label tipo-titulo text-uppercase fw-semibold rotulo-campo-compacto" id="pinRotulo">PIN</label>
          <input type="password" class="form-control form-control-lg tipo-dato text-center campo-pin" id="pinNuevo"
                 inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
          <div class="invalid-feedback" id="pinNuevoAviso"></div>
        </div>

        <div id="pinRepiteGrupo" hidden>
          <label for="pinRepite" class="form-label tipo-titulo text-uppercase fw-semibold rotulo-campo-compacto">Repite el PIN</label>
          <input type="password" class="form-control form-control-lg tipo-dato text-center campo-pin" id="pinRepite"
                 inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
          <div class="invalid-feedback" id="pinRepiteAviso">Los PIN no coinciden.</div>
        </div>

        <div class="d-flex gap-2 flex-wrap">
          <button type="submit" class="btn btn-primary btn-lg flex-fill tipo-titulo text-uppercase fw-semibold btn-accion" id="btnPinOk">Abrir</button>
          <button type="button" class="btn btn-outline-secondary btn-lg flex-fill tipo-titulo text-uppercase fw-semibold btn-accion btn-accion-sec" id="btnPinCancelar">Cancelar</button>
        </div>
        <button type="button" class="btn btn-link p-0 align-self-center fw-semibold" id="btnPinOlvide">¿Olvidaste el PIN?</button>
      </form>
    </div>
  </div>
</div>
