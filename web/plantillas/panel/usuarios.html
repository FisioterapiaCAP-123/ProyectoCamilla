<div class="pestana-admin" id="pestanaUsuarios" hidden>
  <section class="card border shadow-sm rounded-4">
    <div class="card-header bg-body d-flex align-items-center gap-2 flex-wrap p-3 rounded-top-4">
      <h2 class="tipo-titulo text-uppercase mb-0 me-auto titulo-admin">
        Perfiles <span class="badge rounded-pill text-bg-secondary align-middle tipo-dato cuenta-registros" id="cuentaUsuarios">0</span>
      </h2>
      <span class="small text-body-secondary">Cada persona crea su perfil al entrar. Aquí cambias su rol.</span>
    </div>
    <table class="table table-hover align-middle mb-0 tabla-admin">
      <thead>
        <tr>
          <th scope="col" class="ps-3">Perfil</th>
          <th scope="col">Rol</th>
          <th scope="col" class="d-none d-md-table-cell">Creado</th>
          <th scope="col" class="text-end pe-3"><span class="visually-hidden">Acciones</span></th>
        </tr>
      </thead>
      <tbody id="listaUsuarios"></tbody>
    </table>
  </section>
</div>
