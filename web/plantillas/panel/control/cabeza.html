<!-- CABEZA -->
<div class="col-12 col-md-6 col-xxl-12">
  <section class="card seccion border shadow-sm rounded-4 h-100" data-seccion="cabeza" id="tarjetaCabeza">
    <div class="card-header bg-body-tertiary d-flex align-items-center gap-2 flex-wrap">
      <h2 class="tipo-titulo text-uppercase mb-0 titulo-tarjeta">Cabeza</h2>
      <span class="badge text-bg-danger tipo-dato text-uppercase ms-auto d-none" id="topeCabeza">Tope</span>
      <span class="badge text-bg-secondary tipo-dato text-uppercase ms-auto d-none" id="sinActuadorCabeza">Sin actuador</span>
    </div>
    <div class="card-body d-flex flex-column gap-3">

      <div class="estado-seccion" id="movCabeza" data-dir="0" role="status" aria-live="polite">
        <span class="estado-seccion-icono" aria-hidden="true"><svg class="flecha-sube" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6"/><path d="m5 12 7-7 7 7"/></svg><svg class="flecha-baja" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v13"/><path d="m19 12-7 7-7-7"/></svg></span>
        <span class="estado-seccion-texto" id="txtMovCabeza">En reposo</span>
      </div>

      <div class="d-grid gap-2">
        <button type="button" class="btn btn-mover d-flex align-items-center gap-3" data-seccion="cabeza" data-dir="1">
          <span class="icono" aria-hidden="true">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6"/><path d="m5 12 7-7 7 7"/></svg>
          </span>
          <span class="rotulo text-uppercase">Subir</span>
        </button>
        <button type="button" class="btn btn-mover d-flex align-items-center gap-3" data-seccion="cabeza" data-dir="-1">
          <span class="icono" aria-hidden="true">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v13"/><path d="m19 12-7 7-7-7"/></svg>
          </span>
          <span class="rotulo text-uppercase">Bajar</span>
        </button>
      </div>

      <p class="small text-center mb-0 text-body-secondary">
        Mantén pulsado para mover. Al soltar, se detiene.
      </p>

    </div>
  </section>
</div>
