<!-- PIERNAS -->
<div class="col-12 col-md-6 col-xxl-12">
  <section class="card seccion border shadow-sm rounded-4 h-100" data-seccion="piernas" id="tarjetaPiernas">
    <div class="card-header bg-body-tertiary d-flex align-items-center gap-2 flex-wrap">
      <h2 class="tipo-titulo text-uppercase mb-0 titulo-tarjeta">Piernas</h2>
      <span class="badge text-bg-danger tipo-dato text-uppercase ms-auto d-none" id="topePiernas">Tope</span>
    </div>
    <div class="card-body d-flex flex-column gap-3">

      <div class="d-flex align-items-end justify-content-between gap-3">
        <div class="cifra"><span id="valPiernas">0</span><span class="unidad">&deg;</span></div>
        <div class="text-end small fw-semibold lh-sm text-body-secondary">
          Destino
          <b class="d-block tipo-dato dato-destino" id="objPiernas">&mdash;</b>
        </div>
      </div>

      <div>
        <div class="riel-pista">
          <div class="riel-cero d-none" id="ceroPiernas"></div>
          <div class="riel-relleno" id="rellenoPiernas"></div>
          <div class="riel-aguja" id="agujaPiernas"></div>
        </div>
        <div class="riel-escala tipo-dato mt-1 text-body-secondary">
          <span class="riel-min" id="minPiernas"></span>
          <span class="riel-ref d-none" id="etqCeroPiernas"></span>
          <span class="riel-max" id="maxPiernas"></span>
        </div>
      </div>

      <div class="d-grid gap-2">
        <button type="button" class="btn btn-mover d-flex align-items-center gap-3" data-seccion="piernas" data-dir="1">
          <span class="icono" aria-hidden="true">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6"/><path d="m5 12 7-7 7 7"/></svg>
          </span>
          <span class="rotulo text-uppercase">Elevar</span>
          <span class="badge paso tipo-dato ms-auto">+1&deg;</span>
        </button>
        <button type="button" class="btn btn-mover d-flex align-items-center gap-3" data-seccion="piernas" data-dir="-1">
          <span class="icono" aria-hidden="true">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v13"/><path d="m19 12-7 7-7-7"/></svg>
          </span>
          <span class="rotulo text-uppercase">Descender</span>
          <span class="badge paso tipo-dato ms-auto">&minus;1&deg;</span>
        </button>
      </div>

      <p class="small text-center mb-0 text-body-secondary">
        Un toque = 1&deg;. Mantener pulsado = movimiento continuo.
      </p>

      <div class="bg-body-tertiary border rounded-3 p-2">
        <label for="campoPiernas" class="form-label tipo-titulo text-uppercase fw-semibold mb-1 rotulo-campo-compacto">Ir a</label>
        <div class="input-group has-validation">
          <input type="number" class="form-control tipo-dato text-center fw-semibold campo-angulo" id="campoPiernas"
                 inputmode="numeric" step="1" autocomplete="off">
          <span class="input-group-text tipo-dato">&deg;</span>
          <button class="btn btn-acento tipo-titulo text-uppercase fw-semibold px-3 btn-ir" type="button" id="irPiernas">Ir</button>
          <div class="invalid-feedback" id="avisoPiernas"></div>
        </div>
      </div>

    </div>
  </section>
</div>
