<!-- Barra de seguridad -->
<div class="barra-seguridad">
  <div class="card border shadow rounded-4">
    <div class="card-body d-flex align-items-center gap-2 flex-wrap p-2">
      <div class="estado d-flex align-items-center gap-2 bg-body-tertiary border rounded-3 px-3 py-2 flex-grow-1 overflow-hidden"
           id="estado" data-tono="listo" role="status">
        <span class="estado-luz" aria-hidden="true"></span>
        <span class="tipo-dato text-uppercase fw-semibold text-truncate estado-texto" id="estadoTexto">Listo</span>
      </div>
      <button type="button" class="btn btn-danger btn-lg tipo-titulo text-uppercase fw-bold d-inline-flex align-items-center justify-content-center gap-2 flex-grow-1 btn-accion btn-paro"
              id="btnParo">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><rect x="9" y="9" width="6" height="6" rx="1" fill="currentColor" stroke="none"/>
        </svg>
        <span id="txtParo">Paro</span>
      </button>
    </div>
  </div>
</div>
