<!-- ALTURA -->
<div class="col-12">
  <section class="card seccion border shadow-sm rounded-4" data-seccion="altura" id="tarjetaAltura">
    <div class="card-header bg-body-tertiary d-flex align-items-center gap-2 flex-wrap">
      <h2 class="tipo-titulo text-uppercase mb-0 titulo-tarjeta">Altura</h2>
      <span class="badge text-bg-danger tipo-dato text-uppercase ms-auto d-none" id="topeAltura"></span>
    </div>
    <div class="card-body d-flex flex-column gap-3">

      <div class="row g-2">
        <div class="col-6">
          <button type="button" class="btn btn-mover w-100 d-flex align-items-center gap-2 h-100" data-seccion="altura" data-dir="1">
            <span class="icono" aria-hidden="true">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6"/><path d="m5 12 7-7 7 7"/></svg>
            </span>
            <span class="d-flex flex-column lh-sm text-start">
              <span class="rotulo text-uppercase">Subir</span>
              <span class="ayuda small opacity-75">Sube la camilla</span>
            </span>
          </button>
        </div>
        <div class="col-6">
          <button type="button" class="btn btn-mover w-100 d-flex align-items-center gap-2 h-100" data-seccion="altura" data-dir="-1">
            <span class="icono" aria-hidden="true">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v13"/><path d="m19 12-7 7-7-7"/></svg>
            </span>
            <span class="d-flex flex-column lh-sm text-start">
              <span class="rotulo text-uppercase">Bajar</span>
              <span class="ayuda small opacity-75">Baja la camilla</span>
            </span>
          </button>
        </div>
      </div>

      <div>
        <div class="riel-pista">
          <div class="riel-relleno" id="rellenoAltura"></div>
          <div class="riel-aguja" id="agujaAltura"></div>
        </div>
        <div class="riel-escala tipo-dato mt-1 text-body-secondary">
          <span class="riel-min">Tope inferior</span>
          <span class="riel-max">Tope superior</span>
        </div>
      </div>

      <p class="small text-center mb-0 text-body-secondary">
        Recorrido aproximado. Mantén pulsado hasta la altura que necesites.
      </p>

    </div>
  </section>
</div>
