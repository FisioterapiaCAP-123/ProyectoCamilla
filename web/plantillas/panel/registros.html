<div class="pestana-admin" id="pestanaRegistros" hidden>
  <div class="row g-3 align-items-start">

    <div class="col-12 col-lg-4">
      <section class="card border shadow-sm rounded-4 tarjeta-paciente" id="tarjetaPaciente">
        <div class="card-body p-3 p-md-4">
          <h2 class="tipo-titulo text-uppercase mb-3 titulo-admin" id="tituloPaciente">Nuevo registro</h2>
          <form id="formPaciente" novalidate>
            <div class="mb-3">
              <label for="pacNombre" class="form-label tipo-titulo text-uppercase fw-semibold rotulo-campo-compacto">Paciente</label>
              <input type="text" class="form-control form-control-lg" id="pacNombre" maxlength="80"
                     autocomplete="off" autocapitalize="words" placeholder="Nombre completo" required>
              <div class="invalid-feedback" id="pacNombreAviso">Escribe el nombre del paciente.</div>
            </div>
            <div class="mb-4">
              <label for="pacEdad" class="form-label tipo-titulo text-uppercase fw-semibold rotulo-campo-compacto">Edad</label>
              <div class="input-group input-group-lg has-validation campo-edad">
                <input type="number" class="form-control tipo-dato" id="pacEdad" min="0" max="120" step="1"
                       inputmode="numeric" autocomplete="off" required>
                <span class="input-group-text">años</span>
                <div class="invalid-feedback" id="pacEdadAviso">La edad debe ser un número entre 0 y 120.</div>
              </div>
            </div>
            <div class="d-flex gap-2 flex-wrap">
              <button type="submit" class="btn btn-primary btn-lg flex-fill tipo-titulo text-uppercase fw-semibold btn-formulario" id="btnGuardarPaciente">Guardar</button>
              <button type="button" class="btn btn-outline-secondary btn-lg flex-fill tipo-titulo text-uppercase fw-semibold d-none btn-formulario btn-formulario-sec" id="btnCancelarPaciente">Cancelar</button>
            </div>
          </form>
        </div>
      </section>
    </div>

    <div class="col-12 col-lg-8">
      <section class="card border shadow-sm rounded-4 overflow-hidden">
        <div class="card-header bg-body d-flex align-items-center gap-2 flex-wrap p-3">
          <h2 class="tipo-titulo text-uppercase mb-0 me-auto titulo-admin">
            Registros <span class="badge rounded-pill text-bg-secondary align-middle tipo-dato cuenta-registros" id="cuentaPacientes">0</span>
          </h2>
          <input type="search" class="form-control buscador-admin" id="buscarPaciente" placeholder="Buscar paciente" aria-label="Buscar paciente"
                 autocomplete="off">
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0 tabla-admin">
            <thead>
              <tr>
                <th scope="col" class="ps-3">Paciente</th>
                <th scope="col">Edad</th>
                <th scope="col" class="d-none d-sm-table-cell">Registrado</th>
                <th scope="col" class="text-end pe-3"><span class="visually-hidden">Acciones</span></th>
              </tr>
            </thead>
            <tbody id="listaPacientes"></tbody>
          </table>
        </div>
        <p class="text-center py-4 mb-0 d-none text-body-secondary" id="sinPacientes">Todavía no hay registros.</p>
      </section>
    </div>

  </div>
</div>
