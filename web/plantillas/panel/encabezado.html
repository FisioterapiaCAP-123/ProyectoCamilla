<header class="d-flex align-items-center gap-3 flex-wrap border-bottom pb-3 mb-3">
  <span class="d-grid border rounded-3 bg-body shadow-sm flex-shrink-0 icono-marco-chico text-body-secondary" aria-hidden="true">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M3 14h18"/><path d="M3 14 8 8"/><path d="M21 14l-5-4"/><path d="M6 14v5"/><path d="M18 14v5"/>
    </svg>
  </span>
  <div class="me-auto">
    <h1 class="tipo-titulo mb-0 titulo-panel">Camilla articulada</h1>
    <p class="text-uppercase fw-semibold mb-0 subtitulo-panel text-body-secondary">
      Panel de operación
    </p>
  </div>
  <!-- Quien soy: nombre y rol -->
  <div class="d-flex align-items-center gap-2 border rounded-3 bg-body px-2 py-1 overflow-hidden perfil-chip">
    <span class="control-inicial perfil-inicial" id="perfilInicial" aria-hidden="true">&mdash;</span>
    <div class="lh-sm overflow-hidden">
      <div class="fw-semibold text-truncate perfil-nombre" id="perfilNombre">&mdash;</div>
      <div class="tipo-dato text-uppercase perfil-rol text-body-secondary" id="perfilRol">&mdash;</div>
    </div>
  </div>
  <button type="button" class="btn btn-outline-secondary d-inline-flex align-items-center gap-2" id="btnBloqueo" aria-pressed="false">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
      <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
    </svg>
    <span class="texto-boton" id="txtBloqueo">Bloquear</span>
  </button>
  <button type="button" class="btn btn-outline-secondary d-inline-flex align-items-center gap-2" id="btnSalir">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M12 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/>
    </svg>
    <span class="texto-boton">Salir</span>
  </button>
</header>
