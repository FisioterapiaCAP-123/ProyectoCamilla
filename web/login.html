<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrate</title>
  <!-- Bootstrap 6.0.0-alpha.1 guardado en web/bootstrap/: funciona sin internet (en la red Camilla no hay) -->
  <link href="/bootstrap/bootstrap.min.css" rel="stylesheet">
  <script type="module" src="/bootstrap/bootstrap.bundle.min.js"></script>
  <style>
    /* Siempre modo claro, aunque el celular este en modo oscuro (Bootstrap 6 lo sigue solo) */
    :root { color-scheme: only light; }
    body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
    form { background: white; border-radius: 10px; padding: 20px; margin: 0 auto; max-width: 420px; }
    input { font-size: 20px; padding: 12px; width: 100%; box-sizing: border-box;
            border: 1px solid #b8c2cc; border-radius: 10px; }
    button { font-size: 22px; padding: 18px 30px; margin-top: 15px; border: none;
             border-radius: 10px; background: #2b7de9; color: white; cursor: pointer; }
    button:active { background: #1a5bb5; }
  </style>
</head>
<body>
  <h1>Control Camilla</h1>
  <!-- De momento acepta cualquier usuario y contraseña: solo se manda el nombre a /control?nombre=... -->
  <form action="/control" method="get">
  <div class="mb-3">
    <label for="nombre" class="form-label text-align-right">Nombre: </label>
    <input type="text" class="form-control" id="nombre" name="nombre" maxlength="30" autocomplete="username" required autofocus>
  </div>
  <div class="mb-3">
    <label for="contrasena" class="form-label">Contraseña</label>
    <!-- sin name: la contraseña no se envia (aun no se verifica) -->
    <input type="password" class="form-control" id="contrasena" autocomplete="current-password">
  </div>
  <button type="submit" class="btn-solid theme-primary">Iniciar control</button>
</form>
</body>
</html>
